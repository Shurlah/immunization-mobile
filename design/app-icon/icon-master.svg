<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f8a6f"/>
      <stop offset="100%" stop-color="#0b4b3d"/>
    </linearGradient>
    <linearGradient id="barrel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eaf5f0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- Subtle badge ring for depth -->
  <circle cx="512" cy="512" r="330" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="26"/>

  <!-- Syringe group, rotated diagonally -->
  <g transform="rotate(-45 512 512)">
    <!-- needle -->
    <rect x="686" y="500" width="150" height="24" rx="6" fill="#e7f4ee"/>
    <polygon points="836,500 886,512 836,524" fill="#e7f4ee"/>

    <!-- droplet at tip -->
    <path d="M 900 512 C 918 528 918 548 900 560 C 882 548 882 528 900 512 Z" fill="#7fe0bf"/>

    <!-- barrel -->
    <rect x="430" y="466" width="270" height="92" rx="18" fill="url(#barrel)"/>
    <!-- barrel measurement ticks -->
    <rect x="470" y="466" width="6" height="92" fill="#19735f" fill-opacity="0.35"/>
    <rect x="520" y="466" width="6" height="92" fill="#19735f" fill-opacity="0.35"/>
    <rect x="570" y="466" width="6" height="92" fill="#19735f" fill-opacity="0.35"/>
    <rect x="620" y="466" width="6" height="92" fill="#19735f" fill-opacity="0.35"/>

    <!-- finger flange -->
    <rect x="404" y="450" width="34" height="124" rx="10" fill="#ffffff"/>

    <!-- plunger rod -->
    <rect x="300" y="500" width="112" height="24" rx="8" fill="#ffffff"/>

    <!-- plunger thumb press -->
    <rect x="256" y="472" width="52" height="80" rx="16" fill="#ffffff"/>
  </g>
</svg>
